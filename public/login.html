<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logowanie — TERMOGLASS</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">TERMOGLASS</a>
  <nav class="main-nav">
    <a href="index.html">Strona główna</a>
    <a href="o-nas/o-nas.html">O nas</a>
    <a href="kontakt/kontakt.html">Kontakt</a>
  </nav>
</header>

<main class="container auth-wrap">
  <section class="auth-card">
    <h1>Zaloguj się</h1>
    <div class="auth-row">
      <label>E-mail
        <input type="email" id="email" placeholder="admin@local" required>
      </label>
      <label>Hasło
        <input type="password" id="password" placeholder="••••••••" required>
      </label>
      <button class="btn" id="loginBtn">Zaloguj</button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>© <span id="year"></span> TERMOGLASS</p>
</footer>

<script src="app.js"></script>
</body>
</html>
